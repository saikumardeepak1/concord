[project]
name = "concord"
version = "0.1.0"
description = "Enterprise multi-agent customer support operations platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deepak", email = "saikumardeepak1@gmail.com" }]
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.12",
    "mcp>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[project.scripts]
concord = "concord.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concord"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
# UP042: prefer str+Enum mixin for pydantic compatibility (StrEnum surfaces
#        differently in pydantic schemas).
# B008:  typer requires Option() in default values; this is the idiomatic usage.
# N818:  ActionDenied is a control-flow signal, not a runtime exception class.
# RUF001: intentional unicode chars in PII / whitespace regexes.
# RUF005: list concat is clearer than splat in two narrow spots.
ignore = ["E501", "UP042", "B008", "N818", "RUF001", "RUF005"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
