<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concord — Enterprise Support Operations Agent</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181d;
      --panel-2: #1b2128;
      --line: #232a33;
      --ink: #e8ecf1;
      --ink-2: #a3acb8;
      --ink-3: #6c7681;
      --accent: #6aa9ff;
      --accent-2: #8ed4a8;
      --warn: #ffce6f;
      --danger: #ff7c7c;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--line); background: rgba(20,24,29,.6);
      backdrop-filter: saturate(140%) blur(8px);
    }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
    .brand small { color: var(--ink-3); font-size: 12px; }
    .status-pill {
      font-size: 11px; color: var(--ink-2); padding: 4px 10px; border: 1px solid var(--line);
      border-radius: 999px; background: var(--panel);
    }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; min-height: 0; }
    .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .composer {
      border-top: 1px solid var(--line); padding: 14px; display: grid; grid-template-columns: 1fr auto;
      gap: 10px; background: var(--panel);
    }
    textarea {
      width: 100%; min-height: 56px; max-height: 200px; resize: vertical; background: var(--panel-2);
      border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px 12px;
      font-family: inherit; font-size: 14px; line-height: 1.5;
    }
    button {
      background: var(--accent); color: #0b1220; border: none; padding: 0 18px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: .4; cursor: progress; }
    .bubble { max-width: 720px; padding: 12px 14px; border-radius: 12px; line-height: 1.55; font-size: 14px; }
    .bubble.user { background: #1f2630; align-self: flex-end; }
    .bubble.assistant { background: var(--panel-2); align-self: flex-start; border: 1px solid var(--line); }
    .bubble.meta { font-size: 11px; color: var(--ink-3); margin-top: 6px; }
    .badge { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 999px; border: 1px solid var(--line); margin-right: 6px; }
    .badge.outcome-resolved { color: var(--accent-2); border-color: rgba(142,212,168,.4); }
    .badge.outcome-escalated { color: var(--warn); border-color: rgba(255,206,111,.4); }
    .badge.outcome-clarifying { color: var(--accent); border-color: rgba(106,169,255,.4); }
    .badge.outcome-failed { color: var(--danger); border-color: rgba(255,124,124,.4); }
    .citation { font-size: 11px; color: var(--ink-3); margin-top: 6px; }

    .sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
                   padding: 14px 16px 8px; margin: 0; }
    .trace { padding: 0 16px 16px; overflow-y: auto; flex: 1; }
    .span {
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
      background: var(--panel-2); font-size: 12px;
    }
    .span .name { font-weight: 600; color: var(--ink); }
    .span .dur { color: var(--ink-3); float: right; }
    .span pre { margin: 6px 0 0; font-size: 11px; color: var(--ink-2); white-space: pre-wrap; word-wrap: break-word; }
    .controls { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-bottom: 1px solid var(--line); }
    .controls select, .controls input {
      background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
    }
    .footer { padding: 10px 16px; font-size: 11px; color: var(--ink-3); border-top: 1px solid var(--line); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Concord</h1>
      <small>enterprise support operations agent</small>
    </div>
    <span class="status-pill" id="status">ready</span>
  </header>
  <main>
    <section class="chat">
      <div class="messages" id="messages">
        <div class="bubble assistant">
          Hi — I'm the Acme support agent. Ask me about billing, a technical issue,
          or your account. I'll show you my work in the panel on the right.
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="msg" placeholder="e.g. I was charged twice for my Pro subscription this month, can you refund the duplicate?" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
    <aside class="sidebar">
      <div class="controls">
        <select id="plan">
          <option value="free">Free plan</option>
          <option value="pro" selected>Pro plan</option>
          <option value="enterprise">Enterprise plan</option>
        </select>
        <select id="status_sel">
          <option value="active" selected>active</option>
          <option value="past_due">past_due</option>
          <option value="suspended">suspended</option>
          <option value="churned">churned</option>
        </select>
      </div>
      <h2>Trace</h2>
      <div class="trace" id="trace"></div>
      <div class="footer">
        <a href="/metrics" target="_blank">/metrics</a> ·
        <a href="/traces" target="_blank">/traces</a> ·
        <a href="https://github.com/" target="_blank">github</a>
      </div>
    </aside>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const customerId = "demo-" + Math.random().toString(36).slice(2, 8);
    let conversationId = null;

    function bubble(role, text, meta) {
      const m = document.createElement("div");
      m.className = "bubble " + role;
      m.textContent = text;
      if (meta) {
        const mm = document.createElement("div");
        mm.className = "bubble meta";
        mm.innerHTML = meta;
        m.appendChild(mm);
      }
      $("messages").appendChild(m);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function renderTrace(traceId) {
      const r = await fetch(`/traces/${traceId}`);
      if (!r.ok) return;
      const t = await r.json();
      const el = $("trace");
      el.innerHTML = "";
      t.spans.forEach((s) => {
        const d = document.createElement("div");
        d.className = "span";
        d.innerHTML = `<span class="name">${s.name}</span><span class="dur">${s.duration_ms} ms</span>` +
          (Object.keys(s.attributes).length ? `<pre>${JSON.stringify(s.attributes, null, 2)}</pre>` : "") +
          (s.error ? `<pre style="color: var(--danger)">${s.error}</pre>` : "");
        el.appendChild(d);
      });
    }

    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("msg").value.trim();
      if (!text) return;
      $("msg").value = "";
      $("send").disabled = true;
      $("status").textContent = "thinking…";
      bubble("user", text);
      try {
        const resp = await fetch("/support", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_id: customerId,
            plan: $("plan").value,
            account_status: $("status_sel").value,
            message: text,
            conversation_id: conversationId,
          }),
        });
        const data = await resp.json();
        conversationId = data.request_id;
        const cites = (data.citations || []).map(c => `<div class="citation">[${c.source}] ${(c.score*100|0)}%</div>`).join("");
        bubble(
          "assistant",
          data.response_text,
          `<span class="badge outcome-${data.outcome}">${data.outcome}</span>` +
          `<span class="badge">confidence ${(data.confidence*100|0)}%</span>` +
          (data.escalation ? `<span class="badge outcome-escalated">priority ${data.escalation.priority}</span>` : "") +
          cites,
        );
        if (data.trace_id) await renderTrace(data.trace_id);
      } catch (err) {
        bubble("assistant", "Something went wrong on the network. Try again.");
      } finally {
        $("send").disabled = false;
        $("status").textContent = "ready";
      }
    });
  </script>
</body>
</html>
